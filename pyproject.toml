[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmaflow"
version = "0.2.0"
description = "Plataforma Python para automação de projetos Lean Six Sigma usando o framework DMAIC"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "SigmaFlow Contributors" }
]
keywords = [
    "lean", "six-sigma", "dmaic", "spc", "quality",
    "statistics", "process-improvement", "manufacturing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "statsmodels>=0.13",
    "openpyxl>=3.0",
    "jinja2>=3.0",
    # Enterprise dependencies
    "sqlalchemy>=2.0",
    "alembic>=1.12",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "celery>=5.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "typer>=0.12",
    "xlrd>=2.0",
]

[project.optional-dependencies]
latex = ["pylatex>=1.4"]
dev   = ["pytest>=7.0", "pytest-cov", "pytest-asyncio", "ruff", "mypy", "httpx", "faker"]
api   = ["fastapi", "uvicorn", "pydantic", "pydantic-settings", "python-jose", "passlib", "python-multipart"]
worker = ["celery", "redis", "sqlalchemy", "psycopg2-binary", "httpx"]

[project.urls]
Homepage  = "https://github.com/<user>/sigmaflow"
Issues    = "https://github.com/<user>/sigmaflow/issues"

[project.scripts]
sigmaflow = "sigmaflow.cli:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["sigmaflow*"]

[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-v --tb=short"

[tool.ruff]
line-length    = 100
target-version = "py39"
