version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sigmaflow-postgres
    environment:
      POSTGRES_USER: sigmaflow
      POSTGRES_PASSWORD: sigmaflow
      POSTGRES_DB: sigmaflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigmaflow -d sigmaflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sigmaflow-net

  # Redis for Celery
  redis:
    image: redis:7-alpine
    container_name: sigmaflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sigmaflow-net

  # SigmaFlow API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigmaflow-api
    command: uvicorn sigmaflow.api.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - DATABASE_URL=postgresql+asyncpg://sigmaflow:sigmaflow@postgres:5432/sigmaflow
      - DATABASE_URL_SYNC=postgresql+psycopg2://sigmaflow:sigmaflow@postgres:5432/sigmaflow
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sigmaflow-net
    volumes:
      - ./storage:/app/storage

  # Celery Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigmaflow-worker
    command: celery -A sigmaflow.worker.celery_app worker --loglevel=INFO --concurrency=4
    environment:
      - DATABASE_URL=postgresql+asyncpg://sigmaflow:sigmaflow@postgres:5432/sigmaflow
      - DATABASE_URL_SYNC=postgresql+psycopg2://sigmaflow:sigmaflow@postgres:5432/sigmaflow
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sigmaflow-net
    volumes:
      - ./storage:/app/storage

  # Celery Beat (scheduler)
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sigmaflow-beat
    command: celery -A sigmaflow.worker.celery_app beat --loglevel=INFO
    environment:
      - DATABASE_URL=postgresql+asyncpg://sigmaflow:sigmaflow@postgres:5432/sigmaflow
      - DATABASE_URL_SYNC=postgresql+psycopg2://sigmaflow:sigmaflow@postgres:5432/sigmaflow
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sigmaflow-net
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
  redis_data:

networks:
  sigmaflow-net:
    driver: bridge